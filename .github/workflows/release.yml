# デスクトップ版を作り、GitHub Releases に「下書き」で置く（DECISIONS/0006・0007）。
# Windows のインストーラーと Mac の dmg（Apple Silicon・Intel）を並べて作り、最後に 1 つの下書きにまとめる。
# 公開するかどうかは、メンテナーが Releases の画面で下書きを確かめてから決める。
# 使い方: package.json の version と同じタグ（例: v0.1.0）を push する
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: release/GameIdeaLab-Setup-*.exe
          - os: macos-latest
            script: dist:mac
            files: release/GameIdeaLab-*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: タグと package.json の version がそろっているか
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "タグ ${GITHUB_REF_NAME} と package.json の version ${version} が違います" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npm run ${{ matrix.script }}
        env:
          # Mac: 手元の鍵束から証明書を探さない（アドホック署名だけにする）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 下書きの Release に置く
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" --draft --title "Game Idea Lab ${GITHUB_REF_NAME}" --generate-notes
